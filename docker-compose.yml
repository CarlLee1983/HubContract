networks:
  default:
    ipam:
      config:
        # Fixed subnet/gateway (avoids common host subnets like 192.168.0.0/24,
        # 192.168.1.0/24) so the host->container source IP that
        # HUB_MCP_ALLOWED_IPS relies on (Issue #7) doesn't drift on every
        # `docker compose down && up` — Docker Desktop otherwise assigns a new
        # subnet each time and the gateway IP moves with it.
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

services:
  mariadb:
    image: mariadb:10.11.6
    container_name: hub_contract_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_recording_pass
      MYSQL_DATABASE: stationhub_recording
      MYSQL_USER: recording_user
      MYSQL_PASSWORD: recording_pass
    ports:
      - "33066:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.2-alpine
    container_name: hub_contract_redis
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  mongo:
    image: mongo:6.0
    container_name: hub_contract_mongo
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 20

  legacy-app:
    image: stationhub-legacy:recording
    container_name: hub_contract_legacy_app
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # ./.legacy-src is a git worktree pinned to docker/legacy.commit's LEGACY_COMMIT,
      # created by scripts/env-up.sh (Issue #3). STATIONHUB_VENDOR_DIR is exported by
      # env-up.sh (and, as an inert placeholder for `docker compose down`, by
      # env-down.sh too) since StationHub's vendor/ isn't committed to git.
      - ./.legacy-src:/var/www/html
      - ${STATIONHUB_VENDOR_DIR:?請透過 scripts/env-up.sh 啟動}:/var/www/html/vendor:ro
      # Laravel's login view needs a Vite manifest; the contract does not load its UI assets.
      - ./docker/admin-build:/var/www/html/public/build:ro
      - ./docker/.env.recording:/var/www/html/.env:ro
    environment:
      APP_TIMEZONE: Asia/Taipei
      APP_DOMAINS_API: "localhost:8080,127.0.0.1:8080,stationhub.test,cmg-api.test"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/server/status"]
      interval: 2s
      timeout: 2s
      retries: 20
